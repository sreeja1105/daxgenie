version: '3.8'
services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_BACKEND_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
