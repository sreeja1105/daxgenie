services:
  - type: web
    name: daxgenie-api
    env: docker
    branch: main
    plan: free
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: uvicorn api:app --host 0.0.0.0 --port 8000 --no-access-log
    envVars:
      - key: GEMINI_API_KEY
        scope: secret
      - key: SERVICE_API_KEY
        scope: secret
      - key: RATE_LIMIT_PER_MIN
        value: "60"

  - type: web
    name: daxgenie-web
    env: docker
    branch: main
    plan: free
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    envVars:
      - key: GEMINI_API_KEY
        scope: secret
      - key: API_BACKEND_URL
        value: http://daxgenie-api:8000
      - key: SERVICE_API_KEY
        scope: secret
