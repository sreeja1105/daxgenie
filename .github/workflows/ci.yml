name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Syntax check
        run: python -m py_compile app.py api.py
        continue-on-error: true

      - name: Run tests
        env:
          GEMINI_API_KEY: "dummy_key_for_ci_environment"
        run: pytest -q
        continue-on-error: true

      - name: Run linter
        run: flake8 . --max-line-length=120 --exit-zero